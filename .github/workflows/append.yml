name: Update data.md

on:
  push:
    paths:
      - "data/**.json"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-data-md:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Append new templates to data.md
        run: python3 scripts/append.py

      - name: Commit changes
        run: |
          if git diff --quiet -- data.md; then
            echo "No changes to data.md"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.md
          git commit -m "chore: append new template(s) to data.md"
          git push
